<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>體操技能地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F0;
    --surface:#FFFFFF;
    --surface-2:#F7F8F7;
    --border:#D8DDDA;
    --text:#1B2320;
    --text-2:#5B6B65;
    --text-3:#8B9691;
    --accent:#2F6F5E;
    --accent-ink:#173B31;
    --radius:10px;
    --shadow:0 1px 2px rgba(20,30,26,0.06);

    --t-base:#64748B;   --t-base-bg:#EEF1F4;
    --t-pos:#4F7CA6;    --t-pos-bg:#EAF1F7;
    --t-roll:#2F8F6E;   --t-roll-bg:#E9F5F0;
    --t-hsp:#1E7A5B;    --t-hsp-bg:#E4F2EB;
    --t-conn:#B9832A;   --t-conn-bg:#FBF2E1;
    --t-slt:#B8632F;    --t-slt-bg:#FAEEE5;
    --t-shp:#A6552A;    --t-shp-bg:#F7EAE1;
    --t-tws:#8A4FAF;    --t-tws-bg:#F2EAF7;
    --t-dbl:#B23A48;    --t-dbl-bg:#FAE7E9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',-apple-system,'Noto Sans TC',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'IBM Plex Mono',monospace;}

  header{
    padding:18px 20px 0; background:var(--bg);
    position:sticky; top:0; z-index:20;
  }
  .h-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom:12px;}
  h1{font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .h-sub{color:var(--text-2); font-size:13px;}

  .controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px;}
  #search{
    flex:1; min-width:180px; max-width:340px;
    padding:9px 12px; border:1px solid var(--border); border-radius:var(--radius);
    background:var(--surface); font-size:14px; font-family:inherit; color:var(--text);
  }
  #search:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .level-chip{
    padding:6px 12px; border-radius:999px; border:1px solid var(--border);
    background:var(--surface); font-size:12.5px; cursor:pointer; color:var(--text-2);
    user-select:none;
  }
  .level-chip.active{background:var(--accent-ink); border-color:var(--accent-ink); color:#fff;}
  .level-chip:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto;}
  .tab{
    padding:9px 16px; font-size:14px; font-weight:500; color:var(--text-2);
    background:none; border:none; border-bottom:2px solid transparent; cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{color:var(--accent-ink); border-bottom-color:var(--accent-ink);}
  .tab:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}

  main{padding:16px 20px 40px;}
  #board{display:flex; gap:14px; overflow-x:auto; padding-bottom:10px; align-items:flex-start;}
  .col{flex:0 0 220px; width:220px;}
  .col-head{
    padding:7px 10px; border-radius:8px; font-size:13px; font-weight:600;
    margin-bottom:8px; position:sticky; top:0;
  }
  .fam-label{font-size:11px; color:var(--text-3); margin:10px 2px 4px; font-weight:500;}
  .fam-label:first-child{margin-top:0;}

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:8px;
    padding:9px 10px; margin-bottom:7px; cursor:pointer; box-shadow:var(--shadow);
    transition:opacity .12s, box-shadow .12s;
  }
  .card:hover{box-shadow:0 2px 8px rgba(20,30,26,0.12);}
  .card.dim{opacity:0.28;}
  .card.selected{outline:2px solid var(--accent); outline-offset:1px;}
  .card.prereq-hl{outline:2px solid #B8632F; outline-offset:1px;}
  .card.unlock-hl{outline:2px solid #4F7CA6; outline-offset:1px;}
  .card-name{font-size:13px; font-weight:600; line-height:1.35; margin-bottom:3px;}
  .card-meta{display:flex; align-items:center; gap:6px;}
  .card-id{font-size:10.5px; color:var(--text-3);}
  .risk-dot{width:6px; height:6px; border-radius:50%; flex:none;}
  .risk-低{background:#5B9E7E;} .risk-中{background:#D2A03A;} .risk-高{background:#C0504A;}

  .empty-col{color:var(--text-3); font-size:12px; padding:8px 2px;}

  /* detail panel */
  #overlay{
    position:fixed; inset:0; background:rgba(20,25,22,0.32); z-index:40;
    display:none;
  }
  #panel{
    position:fixed; top:0; right:0; height:100%; width:380px; max-width:92vw;
    background:var(--surface); z-index:41; box-shadow:-4px 0 24px rgba(0,0,0,0.14);
    transform:translateX(100%); transition:transform .18s ease-out;
    overflow-y:auto; padding:22px 20px 40px;
  }
  #panel.open{transform:translateX(0);}
  #overlay.show{display:block;}
  .panel-close{
    position:absolute; top:16px; right:16px; background:none; border:none;
    font-size:20px; color:var(--text-2); cursor:pointer; line-height:1; padding:4px;
  }
  .p-tier-badge{
    display:inline-block; font-size:11.5px; font-weight:600; padding:3px 9px;
    border-radius:999px; margin-bottom:10px;
  }
  .p-name{font-size:19px; font-weight:700; margin:0 0 2px; padding-right:24px;}
  .p-id{font-size:12px; color:var(--text-3); margin-bottom:16px;}
  .p-section{margin-bottom:16px;}
  .p-label{font-size:11.5px; font-weight:600; color:var(--text-2); margin-bottom:5px;}
  .p-value{font-size:13.5px; line-height:1.6; color:var(--text);}
  .p-cue{background:var(--surface-2); border-radius:8px; padding:8px 10px; font-size:13.5px; line-height:1.7;}
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{
    font-size:12px; padding:5px 9px; border-radius:7px; background:var(--surface-2);
    border:1px solid var(--border); cursor:pointer; color:var(--text);
  }
  .chip:hover{border-color:var(--accent);}
  .p-empty{color:var(--text-3); font-size:13px;}
  .p-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}

  @media (max-width:640px){
    .col{flex:0 0 190px; width:190px;}
    #panel{width:100%; max-width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="h-row">
    <h1>體操技能地圖</h1>
    <span class="h-sub">148 個節點 · 5 個項目 · 依難度分級排列</span>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="搜尋動作名稱或節點編號…" autocomplete="off">
    <div id="levelChips"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="board"></div>
</main>

<div id="overlay"></div>
<div id="panel">
  <button class="panel-close" aria-label="關閉">✕</button>
  <div id="panelBody"></div>
</div>

<script>
const RAW = JSON.parse(document.getElementById('skillmap-data').textContent);
const NODES = RAW.nodes;
const DISCIPLINES = RAW.disciplines;

const TIER_PRIORITY = {
  '基礎':0, '直立':1, '臀落':2, '膝落':3, '手膝落':4, '腹落':5, '背落':6,
  '滾翻':7, '手翻':8, '動作連接':9,
  '空翻':10, '空翻體勢變化':11, '空翻轉體':12, '空翻周數變化':13
};
const TIER_CLASS = {
  '基礎':'base', '直立':'base', '臀落':'pos', '膝落':'pos', '手膝落':'pos',
  '腹落':'pos', '背落':'pos', '滾翻':'roll', '手翻':'hsp', '動作連接':'conn',
  '空翻':'slt', '空翻體勢變化':'shp', '空翻轉體':'tws', '空翻周數變化':'dbl'
};
const LEVEL_ORDER = ['入門','中階','進階','選手(非目前學生群主要範圍)'];

let state = {
  discipline: DISCIPLINES.includes('地板') ? '地板' : DISCIPLINES[0],
  levels: new Set(LEVEL_ORDER),
  search: '',
  selected: null
};

function getNode(id){ return NODES[id]; }

function tierColorVars(tier){
  const cls = TIER_CLASS[tier] || 'base';
  return { fg: `var(--t-${cls})`, bg: `var(--t-${cls}-bg)` };
}

function nodeMatchesSearch(n, q){
  if(!q) return true;
  const s = q.toLowerCase();
  return n.name.toLowerCase().includes(s) || n.node_id.toLowerCase().includes(s);
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = '';
  DISCIPLINES.forEach(d=>{
    const b = document.createElement('button');
    b.className = 'tab' + (d===state.discipline ? ' active' : '');
    b.textContent = d;
    b.addEventListener('click', ()=>{ state.discipline = d; renderBoard(); renderTabs(); });
    el.appendChild(b);
  });
}

function renderLevelChips(){
  const el = document.getElementById('levelChips');
  el.innerHTML = '';
  const present = LEVEL_ORDER.filter(lv => Object.values(NODES).some(n=>n.student_level===lv));
  present.forEach(lv=>{
    const b = document.createElement('button');
    b.className = 'level-chip' + (state.levels.has(lv) ? ' active' : '');
    b.textContent = lv.replace('(非目前學生群主要範圍)','·選手');
    b.addEventListener('click', ()=>{
      if(state.levels.has(lv)) state.levels.delete(lv); else state.levels.add(lv);
      renderLevelChips(); renderBoard();
    });
    el.appendChild(b);
  });
}

function findFirstMatch(q){
  if(!q) return null;
  // 先找目前分頁內符合的
  const inCurrent = Object.values(NODES).find(n=> n.discipline===state.discipline && nodeMatchesSearch(n,q));
  if(inCurrent) return inCurrent;
  for(const d of DISCIPLINES){
    const hit = Object.values(NODES).find(n=> n.discipline===d && nodeMatchesSearch(n,q));
    if(hit) return hit;
  }
  return null;
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  const nodesInTab = Object.values(NODES).filter(n=>n.discipline===state.discipline);
  const tiers = [...new Set(nodesInTab.map(n=>n.tier))].sort((a,b)=>(TIER_PRIORITY[a]??99)-(TIER_PRIORITY[b]??99));

  const selectedNode = state.selected ? getNode(state.selected) : null;
  const prereqSet = selectedNode ? new Set(selectedNode.prerequisites) : new Set();
  const unlockSet = selectedNode ? new Set(selectedNode.unlocks) : new Set();

  tiers.forEach(tier=>{
    const col = document.createElement('div');
    col.className = 'col';
    const colors = tierColorVars(tier);
    const head = document.createElement('div');
    head.className = 'col-head';
    head.style.background = colors.bg;
    head.style.color = colors.fg;
    head.textContent = tier;
    col.appendChild(head);

    const nodesInTier = nodesInTab.filter(n=>n.tier===tier);
    const families = [...new Set(nodesInTier.map(n=>n.family || ''))];
    families.forEach(fam=>{
      if(fam){
        const fl = document.createElement('div');
        fl.className = 'fam-label';
        fl.textContent = fam;
        col.appendChild(fl);
      }
      nodesInTier.filter(n=>(n.family||'')===fam).forEach(n=>{
        const card = document.createElement('div');
        let cls = 'card';
        const visible = nodeMatchesSearch(n, state.search) && state.levels.has(n.student_level);
        if(!visible) cls += ' dim';
        if(state.selected===n.node_id) cls += ' selected';
        else if(prereqSet.has(n.node_id)) cls += ' prereq-hl';
        else if(unlockSet.has(n.node_id)) cls += ' unlock-hl';
        card.className = cls;
        card.dataset.id = n.node_id;
        card.innerHTML = `
          <div class="card-name">${n.name}</div>
          <div class="card-meta">
            <span class="risk-dot risk-${n.risk_level||'低'}"></span>
            <span class="card-id mono">${n.node_id}</span>
          </div>`;
        card.addEventListener('click', ()=> selectNode(n.node_id));
        col.appendChild(card);
      });
    });
    if(nodesInTier.length===0){
      const e = document.createElement('div');
      e.className = 'empty-col';
      e.textContent = '（無節點）';
      col.appendChild(e);
    }
    board.appendChild(col);
  });
}

function chipRow(ids, emptyText){
  if(!ids || ids.length===0) return `<div class="p-empty">${emptyText}</div>`;
  return '<div class="chip-row">' + ids.map(id=>{
    const n = getNode(id);
    const label = n ? `${n.name}` : id;
    return `<button class="chip" data-jump="${id}">${label}</button>`;
  }).join('') + '</div>';
}

function renderPanel(n){
  const colors = tierColorVars(n.tier);
  const body = document.getElementById('panelBody');
  body.innerHTML = `
    <span class="p-tier-badge" style="background:${colors.bg};color:${colors.fg}">${n.tier}${n.family ? ' · '+n.family : ''}</span>
    <h2 class="p-name">${n.name}</h2>
    <div class="p-id mono">${n.node_id} · ${n.discipline}</div>

    <div class="p-section">
      <div class="p-label">先備動作</div>
      ${chipRow(n.prerequisites, '無（起始節點）')}
    </div>

    <div class="p-section">
      <div class="p-label">解鎖以下動作</div>
      ${chipRow(n.unlocks, '目前無下游節點')}
    </div>

    <div class="p-section p-grid">
      <div><div class="p-label">風險係數</div><div class="p-value">${n.risk_level||'-'}</div></div>
      <div><div class="p-label">適用學生程度</div><div class="p-value">${(n.student_level||'-').replace('(非目前學生群主要範圍)','（選手）')}</div></div>
      <div><div class="p-label">預估訓練次數</div><div class="p-value">${n.est_sessions||'-'}</div></div>
      <div><div class="p-label">退階/輔助動作</div><div class="p-value">${n.regression||'無'}</div></div>
    </div>

    <div class="p-section">
      <div class="p-label">所需素質</div>
      <div class="p-value">${n.required_qualities||'-'}</div>
    </div>
    <div class="p-section">
      <div class="p-label">常見錯誤/代償</div>
      <div class="p-value">${n.common_faults||'-'}</div>
    </div>
    <div class="p-section">
      <div class="p-label">教學要領/口令</div>
      <div class="p-cue">${n.teaching_cues||'-'}</div>
    </div>
    <div class="p-section">
      <div class="p-label">掌握標準</div>
      <div class="p-value">${n.mastery_criteria||'-'}</div>
    </div>
  `;
  body.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=> selectNode(el.dataset.jump));
  });
}

function openPanel(){
  document.getElementById('panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  state.selected = null;
  renderBoard();
}

function selectNode(id){
  const n = getNode(id);
  if(!n) return;
  if(n.discipline !== state.discipline){
    state.discipline = n.discipline;
    renderTabs();
  }
  state.selected = id;
  renderBoard();
  renderPanel(n);
  openPanel();
  requestAnimationFrame(()=>{
    const el = document.querySelector(`.card[data-id="${id}"]`);
    if(el) el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  });
}

document.getElementById('overlay').addEventListener('click', closePanel);
document.querySelector('.panel-close').addEventListener('click', closePanel);
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closePanel(); });

document.getElementById('search').addEventListener('input', e=>{
  state.search = e.target.value.trim();
  const match = findFirstMatch(state.search);
  if(match && match.discipline !== state.discipline){
    state.discipline = match.discipline;
    renderTabs();
  }
  renderBoard();
  if(state.search && match){
    requestAnimationFrame(()=>{
      const el = document.querySelector(`.card[data-id="${match.node_id}"]`);
      if(el) el.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
    });
  }
});

renderTabs();
renderLevelChips();
renderBoard();

</script>
</body>
</html>
